---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pharos
  labels:
    app: pharos
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  port:
    targetPort: https
  to:
    kind: Service
    name: pharos
    weight: 100
  # SPRE-7088: TLS ends at kube-rbac-proxy, so the router re-encrypts.
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
